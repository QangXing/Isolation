name: Build APK and Publish to Issue

on:
  push:
    branches:
      - feature/ui-implementation
      - feature/*
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'feature/ui-implementation'
        type: string

permissions:
  contents: write
  issues: write

env:
  JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
  GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get dependencies
        run: flutter pub get

      - name: Run parser tests
        run: flutter test test/parser_test.dart

      - name: Use local Gradle distribution
        run: |
          GRADLE_ZIP="${{ github.workspace }}/android/gradle/gradle-9.1.0-all.zip"
          if [ ! -f "$GRADLE_ZIP" ]; then
            echo "Gradle distribution not found in repository"
            exit 1
          fi
          ls -lh "$GRADLE_ZIP"
          # 让 wrapper 直接读仓库里的本地文件，不再走网络
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\ndistributionUrl=file\\://%s\n' "$GRADLE_ZIP" > "${{ github.workspace }}/android/gradle/wrapper/gradle-wrapper.properties"
          cat "${{ github.workspace }}/android/gradle/wrapper/gradle-wrapper.properties"

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish-to-issue:
    name: Publish APK to Issue
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./release

      - name: Create / update GitHub Release with APK
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="apk-build-${{ github.run_number }}"
          NOTES=$(printf '由 GitHub Actions 自动构建。\n分支：%s\nCommit：%s' "${{ github.ref_name }}" "${{ github.sha }}")
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" ./release/app-release.apk \
              --repo "${{ github.repository }}" \
              --title "APK 构建 #${{ github.run_number }}" \
              --notes "$NOTES"
          else
            gh release upload "$TAG" ./release/app-release.apk --repo "${{ github.repository }}" --clobber
          fi
          echo "download_url=https://github.com/${{ github.repository }}/releases/download/${TAG}/app-release.apk" >> "$GITHUB_OUTPUT"

      - name: Create issue with APK download link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="apk-build-${{ github.run_number }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/app-release.apk"
          BODY=$(printf 'Flutter APK 已由 GitHub Actions 自动构建完成。\n\n**下载 APK：** %s\n\n| 项目 | 值 |\n| --- | --- |\n| 分支 | %s |\n| Commit | %s |\n| 构建运行 | https://github.com/%s/actions/runs/%s |' \
            "$URL" "${{ github.ref_name }}" "${{ github.sha }}" "${{ github.repository }}" "${{ github.run_id }}")
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "APK 构建 #${{ github.run_number }}" \
            --body "$BODY"