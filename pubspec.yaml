name: isolation
description: "Cross-app automation tool for Android: record and replay touch macros via a floating ball, with a programmable macro DSL."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  file_picker: ^8.0.6
  path: ^1.9.0
  path_provider: ^2.1.4
  archive: ^3.6.1
  share_plus: ^9.0.0
  image: ^4.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
